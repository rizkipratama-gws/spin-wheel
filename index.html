<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dual Wheel Spinner - Absen & Soal</title>
    <!-- Hubungkan ke file CSS eksternal -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <h1>🎯 Spin Undian Absen & Soal</h1>
        <p class="subtitle">Sistem otomatis: Absen urut, Soal otomatis menyesuaikan.</p>

        <div class="wheels-wrapper">
            <!-- Roda 1: Absen -->
            <div class="wheel-card">
                <h2>Roda Absen</h2>
                <div id="wheel-absen" class="wheel-box">Klik Putar</div>
            </div>

            <!-- Roda 2: Soal -->
            <div class="wheel-card">
                <h2>Roda Soal</h2>
                <div id="wheel-soal" class="wheel-box">Klik Putar</div>
            </div>
        </div>

        <!-- Tombol Utama -->
        <button id="spin-btn" onclick="jalankanSpin()">Putar Kedua Roda!</button>

        <!-- Kotak Hasil Akhir -->
        <div id="result-box" class="hidden">
            <h3>Hasil Terpilih:</h3>
            <p id="result-text"></p>
        </div>
    </div>

    <!-- Hubungkan ke file JavaScript eksternal -->
    <script src="script.js"></script>
</body>
</html>
